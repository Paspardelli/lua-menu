<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel da loja | Lua Menu</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/luamenu-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
  <!-- Entrar -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="login__card" novalidate>
      <div class="login__brand"><img src="assets/luamenu-mark.svg" alt=""> Lua Menu</div>
      <h1>Painel da loja</h1>
      <p class="hint">Acompanhe pedidos, estoque e cardápio da sua lanchonete.</p>
      <div id="loginErr"></div>
      <div class="field"><label for="l-slug">Endereço da loja</label><input id="l-slug" name="slug" placeholder="ex.: me-gusta" autocomplete="off"></div>
      <div id="localFields" class="field"><label for="l-pin">PIN de acesso</label><input id="l-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password"></div>
      <div id="remoteFields" hidden>
        <div class="field"><label for="l-email">E-mail</label><input id="l-email" name="email" type="email" autocomplete="username"></div>
        <div class="field"><label for="l-pass">Senha</label><input id="l-pass" name="password" type="password" autocomplete="current-password"></div>
      </div>
      <button class="btn btn--block" type="submit">Entrar</button>
      <p id="demoHint" class="hint" style="margin-top:12px" hidden></p>
      <p class="hint" style="margin-top:12px"><a href="index.html">Voltar ao Lua Menu</a></p>
    </form>
  </main>

  <!-- Painel -->
  <div id="app" hidden>
    <header class="top">
      <div class="top__in">
        <div class="top__id"><div id="tAv" class="av"></div><div><b id="tName"></b><small id="tSub"></small></div></div>
        <label class="sw" title="Abrir ou fechar a loja para pedidos"><input id="openSw" type="checkbox"><i></i><span id="openLbl">Loja aberta</span></label>
        <a id="viewLink" class="btn btn--soft btn--sm" href="#" target="_blank" rel="noopener">Ver loja</a>
        <button id="logout" class="btn btn--ghost btn--sm" type="button">Sair</button>
      </div>
      <nav class="tabs" id="tabs" aria-label="Seções do painel">
        <button class="ptab is-on" data-tab="pedidos">Pedidos<span id="newBadge" class="dotn" hidden>0</span></button>
        <button class="ptab" data-tab="estoque">Estoque</button>
        <button class="ptab" data-tab="cardapio">Cardápio</button>
        <button class="ptab" data-tab="ajustes">Ajustes</button>
        <button class="ptab" data-tab="divulgar">Divulgação</button>
      </nav>
    </header>
    <main class="page" id="page" aria-live="polite"></main>
  </div>

  <div id="sheetBack" class="sheet-back" hidden></div>
  <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon-btn" type="button" aria-label="Fechar">&times;</button></div>
    <div id="sheetBody" class="sheet__body"></div>
  </aside>
  <div id="ticket" class="print-only"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
